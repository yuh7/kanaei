name: build

# タグを push したらビルドして Releases に exe を置く。
# csc.exe は windows ランナーに最初から入っているので、追加のセットアップは要らない。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # 新しめのリポジトリは GITHUB_TOKEN が既定で読み取り専用なので、
    # リリースを作るために書き込みを明示しておく。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ビルド
        shell: pwsh
        run: ./build.ps1

      - name: 成果物を確認
        shell: pwsh
        run: |
          $exe = 'bin/Kanaei.exe'
          if (-not (Test-Path $exe)) { throw "$exe ができていません" }
          Get-Item $exe | Select-Object Name, Length, LastWriteTime | Format-List

      - name: 成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: Kanaei
          path: |
            bin/Kanaei.exe
            README.md
            LICENSE

      - name: ハッシュを出す
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin/Kanaei.exe -Algorithm SHA256).Hash
          Write-Host $hash
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: リリースに添付
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Kanaei.exe
          body: |
            `Kanaei.exe` をダウンロードして、好きなフォルダに置いて実行してください。

            署名していない exe なので、初回起動時に SmartScreen の警告が出ます。
            「詳細情報」から「実行」に進んでください。

            この exe は GitHub Actions がこのリポジトリのソースをそのままビルドしたものです。
            ビルドの過程は Actions のログで全部見られます。
            自分でビルドしたものと同じか確かめたい場合は、次のハッシュと照らしてください。

            ```
            SHA256: ${{ env.SHA256 }}
            ```
